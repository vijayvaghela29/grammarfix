<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrammarFix — Offline AI</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
<header>
<div class="badge">⚡ QVAC POWERED</div>
<h1>Grammar<span>Fix</span></h1>
<p>AI grammar correction running locally on your device.</p>
</header>

<section class="card">
<label for="inputText">Your text</label>
<textarea id="inputText" placeholder="Type or paste your sentence here..."></textarea>
<button id="checkBtn">✨ Check Grammar</button>
<div id="status"></div>
</section>

<section class="card result-card">
<h2>Corrected Text</h2>
<div id="correctedText">Your corrected text will appear here.</div>

<h2>Explanation</h2>
<div id="explanation">Grammar explanations will appear here.</div>
</section>

<footer>🔒 Your text stays on your device.</footer>
</main>

<script src="/app.js"></script>
</body>
</html>
